name: DroidPad CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # ─── Linux Daemon ────────────────────────────────────────────
  linux-daemon:
    name: Linux Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libbluetooth-dev pkg-config \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-daemon

      - name: Check formatting
        working-directory: linux-daemon
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: linux-daemon
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (debug)
        working-directory: linux-daemon
        run: cargo build --all

      - name: Run tests
        working-directory: linux-daemon
        run: cargo test --all

      - name: Build (release)
        if: github.event_name == 'release'
        working-directory: linux-daemon
        run: cargo build --release

      - name: Upload release binary
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: linux-daemon/target/release/droidpad-daemon
          asset_name: droidpad-daemon-linux-${{ matrix.os }}-x86_64
          asset_content_type: application/octet-stream

  # ─── Android App ─────────────────────────────────────────────
  android-app:
    name: Android App
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-app/**/*.gradle.kts', 'android-app/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Lint
        working-directory: android-app
        run: ./gradlew lint

      - name: Run unit tests
        working-directory: android-app
        run: ./gradlew test

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droidpad-debug.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (on release)
        if: github.event_name == 'release'
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > app/keystore.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload release APK
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android-app/app/build/outputs/apk/release/app-release.apk
          asset_name: droidpad-release.apk
          asset_content_type: application/vnd.android.package-archive

  # ─── Protocol Consistency Check ──────────────────────────────
  protocol-check:
    name: Protocol Spec Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify PROTOCOL.md exists
        run: test -f docs/PROTOCOL.md
      - name: Check magic bytes consistency
        run: |
          grep -r "0x44.*0x50\|0x50.*0x44\|\"DP\"" \
            linux-daemon/src android-app/app/src --include="*.rs" --include="*.kt" \
            | wc -l | xargs -I{} test {} -gt 0
