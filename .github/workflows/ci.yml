name: DroidPad CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Linux Daemon ────────────────────────────────────────────
  linux-daemon:
    name: Linux Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libbluetooth-dev pkg-config \
            libdbus-1-dev desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-daemon

      - name: Check formatting
        working-directory: linux-daemon
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: linux-daemon
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: linux-daemon
        run: cargo test --all

      - name: Validate desktop entry
        run: desktop-file-validate linux-daemon/packaging/droidpad.desktop

      - name: Build (release)
        working-directory: linux-daemon
        run: cargo build --release

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidpad-daemon-${{ matrix.os }}-x86_64
          path: linux-daemon/target/release/droidpad-daemon

  # ─── Android App ─────────────────────────────────────────────
  android-app:
    name: Android App CI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidpad-debug.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  # ─── Protocol Consistency Check ──────────────────────────────
  protocol-check:
    name: Protocol Spec Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify PROTOCOL.md exists
        run: test -f docs/PROTOCOL.md
      - name: Check magic bytes consistency
        run: |
          grep -r "0x44.*0x50\|0x50.*0x44\|\"DP\"" \
            linux-daemon/src android-app/app/src --include="*.rs" --include="*.kt" \
            | wc -l | xargs -I{} test {} -gt 0
