name: DroidPad CI

on:
  push:
    branches: [main, develop, Trial]
  pull_request:
    branches: [main, develop, Trial]

permissions:
  contents: read

jobs:
  # ─── Linux Daemon ────────────────────────────────────────────
  linux-daemon:
    name: Linux Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libbluetooth-dev pkg-config \
            libdbus-1-dev desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-daemon

      - name: Check formatting
        working-directory: linux-daemon
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: linux-daemon
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: linux-daemon
        run: |
          cargo test --all -- --nocapture 2>&1 | tee test-output.txt

      - name: Publish Linux Daemon Test Summary
        if: always()
        run: |
          python3 .github/scripts/report_daemon_tests.py linux-daemon/test-output.txt "${{ matrix.os }}"

      - name: Upload Linux test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-daemon-test-results-${{ matrix.os }}
          path: linux-daemon/test-output.txt

      - name: Validate desktop entry
        run: desktop-file-validate linux-daemon/packaging/droidpad.desktop

      - name: Build (release)
        working-directory: linux-daemon
        run: cargo build --release

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidpad-daemon-${{ matrix.os }}-x86_64
          path: linux-daemon/target/release/droidpad-daemon

  # ─── Android App ─────────────────────────────────────────────
  android-app:
    name: Android App CI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --continue

      - name: Publish Android Test Summary
        if: always()
        run: |
          python3 .github/scripts/report_android_tests.py android-app/app/build/test-results/testDebugUnitTest

      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android-app/app/build/reports/tests/testDebugUnitTest/
            android-app/app/build/test-results/testDebugUnitTest/

      - name: Build debug APK
        working-directory: android-app
        run: |
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidpad-debug.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  # ─── Protocol Consistency Check ──────────────────────────────
  protocol-check:
    name: Protocol Spec Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify PROTOCOL.md exists
        run: test -f docs/PROTOCOL.md
      - name: Check magic bytes consistency
        run: |
          grep -r "0x44.*0x50\|0x50.*0x44\|\"DP\"" \
            linux-daemon/src android-app/app/src --include="*.rs" --include="*.kt" \
            | wc -l | xargs -I{} test {} -gt 0

      - name: Publish Protocol Check Summary
        if: always()
        run: |
          echo "### 📋 Protocol Specification Check" >> $GITHUB_STEP_SUMMARY
          echo "- **PROTOCOL.md**: Verified ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Magic Bytes (0x44 0x50 / DP)**: Verified across Rust & Kotlin codebases ✅" >> $GITHUB_STEP_SUMMARY
