name: DroidPad Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── 1. Build Linux AppImage & Standalone Binary ─────────────
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libbluetooth-dev libdbus-1-dev pkg-config \
            desktop-file-utils file libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-daemon

      - name: Validate desktop entry
        run: desktop-file-validate linux-daemon/packaging/droidpad.desktop

      - name: Build AppImage and Binaries
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p dist
          # Run the AppImage build script
          chmod +x linux-daemon/packaging/build-appimage.sh
          linux-daemon/packaging/build-appimage.sh dist

          # Copy standalone headless binary and uinput permission helper
          cp linux-daemon/target/release/droidpad-daemon dist/droidpad-daemon-linux-x86_64
          cp packaging/setup-uinput.sh dist/setup-uinput.sh
          chmod +x dist/setup-uinput.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  # ─── 2. Build Android Release APK ────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android-app

      - name: Build release APK
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
            export KEYSTORE_PATH="$(pwd)/app/keystore.jks"
          fi
          ./gradlew assembleRelease

          mkdir -p ../dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          cp "$APK_PATH" ../dist/droidpad.apk
          echo "Release APK created: ../dist/droidpad.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/droidpad.apk

  # ─── 3. Publish to GitHub Releases ───────────────────────────
  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: release-assets

      - name: Display release assets
        run: ls -la release-assets/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/droidpad.apk
            release-assets/DroidPad-x86_64.AppImage
            release-assets/setup-uinput.sh
            release-assets/droidpad-daemon-linux-x86_64
          draft: false
          prerelease: false
          generate_release_notes: true
