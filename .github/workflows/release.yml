name: DroidPad Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── 1. Build Linux AppImage & Standalone Binary ─────────────
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libbluetooth-dev libdbus-1-dev pkg-config \
            desktop-file-utils file libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-daemon

      - name: Build release binary
        working-directory: linux-daemon
        run: cargo build --release

      - name: Validate desktop entry
        run: desktop-file-validate linux-daemon/packaging/droidpad.desktop

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # Download linuxdeploy and appimagetool with FUSE fallback
          mkdir -p tools
          curl -sSL -o tools/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o tools/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/linuxdeploy tools/appimagetool

          # Prepare AppDir
          APPDIR="linux-daemon/target/AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${APPDIR}/usr/share/glib-2.0/schemas"

          cp linux-daemon/target/release/droidpad-daemon "${APPDIR}/usr/bin/droidpad-daemon"
          chmod +x "${APPDIR}/usr/bin/droidpad-daemon"
          cp linux-daemon/packaging/droidpad.desktop "${APPDIR}/usr/share/applications/droidpad.desktop"
          cp linux-daemon/packaging/droidpad.desktop "${APPDIR}/droidpad.desktop"
          cp linux-daemon/packaging/droidpad.svg "${APPDIR}/usr/share/icons/hicolor/scalable/apps/droidpad.svg"
          cp linux-daemon/packaging/droidpad.svg "${APPDIR}/droidpad.svg"
          cp linux-daemon/packaging/droidpad.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/droidpad.png"
          cp linux-daemon/packaging/droidpad.png "${APPDIR}/droidpad.png"
          cp linux-daemon/packaging/droidpad.png "${APPDIR}/.DirIcon"

          # Bundle schemas
          if [ -d /usr/share/glib-2.0/schemas ]; then
            cp -r /usr/share/glib-2.0/schemas/* "${APPDIR}/usr/share/glib-2.0/schemas/" 2>/dev/null || true
            glib-compile-schemas "${APPDIR}/usr/share/glib-2.0/schemas" || true
          fi

          # Create AppRun
          cat << 'EOF' > "${APPDIR}/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          export GSETTINGS_SCHEMA_DIR="${HERE}/usr/share/glib-2.0/schemas:${GSETTINGS_SCHEMA_DIR}"
          exec "${HERE}/usr/bin/droidpad-daemon" "$@"
          EOF
          sed -i 's/^[ \t]*//' "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          # Package AppImage using appimagetool
          mkdir -p dist
          ./tools/appimagetool --appimage-extract-and-run "${APPDIR}" dist/DroidPad-x86_64.AppImage
          chmod +x dist/DroidPad-x86_64.AppImage

          # Copy standalone binary and uinput setup script
          cp linux-daemon/target/release/droidpad-daemon dist/droidpad-daemon-linux-x86_64
          cp packaging/setup-uinput.sh dist/setup-uinput.sh
          chmod +x dist/setup-uinput.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  # ─── 2. Build Android Release APK ────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
            export KEYSTORE_PATH="$(pwd)/app/keystore.jks"
          fi
          ./gradlew assembleRelease

          mkdir -p ../dist
          # Find and copy output APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          cp "$APK_PATH" ../dist/droidpad.apk
          echo "Release APK created: ../dist/droidpad.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/droidpad.apk

  # ─── 3. Publish to GitHub Releases ───────────────────────────
  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: release-assets

      - name: Display release assets
        run: ls -la release-assets/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/droidpad.apk
            release-assets/DroidPad-x86_64.AppImage
            release-assets/setup-uinput.sh
            release-assets/droidpad-daemon-linux-x86_64
          draft: false
          prerelease: false
          generate_release_notes: true
