[package]
name = "droidpad-daemon"
version = "0.1.0"
edition = "2021"
description = "Linux daemon for DroidPad — use an Android device as keyboard/gamepad over Wi-Fi, Bluetooth, or USB"
license = "Apache-2.0"

[[bin]]
name = "droidpad-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
evdev = "0.12"
nix = { version = "0.29", features = ["net"] }
bluer = { version = "0.17", features = ["full"] }
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
gtk4 = "0.9"
libadwaita = "0.7"
rcgen = "0.13"
async-trait = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
